<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>❤️ 2000 I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            padding: 10px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            background: #0b0a0f;
            border-radius: 28px;
            touch-action: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="heartCanvas" width="700" height="700"></canvas>
</div>

<script>
    (function() {
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const W = 700, H = 700;
        canvas.width = W; canvas.height = H;

        // ─── پارامترهای قلب ──────────────────────────────────────────────
        const SCALE = 13.5;
        const CX = W/2, CY = H/2 + 4;

        function heartX(t) { return SCALE * 16 * Math.pow(Math.sin(t), 3); }
        function heartY(t) { return SCALE * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

        // ─── تولید خطوط قلب ──────────────────────────────────────────────
        const OUTLINE_COUNT = 120;
        let heartOutline = [];
        function generateHeartOutline() {
            heartOutline = [];
            for (let i = 0; i < OUTLINE_COUNT; i++) {
                const t = (i / OUTLINE_COUNT) * 2 * Math.PI;
                heartOutline.push({
                    x: CX + heartX(t),
                    y: CY - heartY(t)
                });
            }
        }
        generateHeartOutline();

        // ─── اندازه فونت ────────────────────────────────────────────────────
        function getFontSize() {
            const base = Math.min(W, H) / 42;
            return Math.max(9, Math.min(16, base));
        }

        const TEXT = 'i love you';
        const BLUE_COLOR = '#0D6EFD';
        const GLOW_COLOR = '#1E90FF';

        function drawTextAt(x, y, alpha = 0.85) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${getFontSize()}px -apple-system, "Segoe UI", "Arial", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = GLOW_COLOR;
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.fillStyle = BLUE_COLOR;
            ctx.fillText(TEXT, x, y);

            ctx.shadowBlur = 14;
            ctx.fillText(TEXT, x, y);

            ctx.restore();
        }

        // ─── وضعیت انیمیشن ──────────────────────────────────────────────────
        let outlineIndex = 0;
        let phase = 'outline';
        let lastTimestamp = 0;
        let animationFrameId = null;
        let outlineTimer = 0;

        const OUTLINE_INTERVAL = 60;
        const BATCH_SIZE = 3;

        // ─── رندر ──────────────────────────────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, W, H);

            // فقط دور قلب رسم می‌شود
            for (let i = 0; i < outlineIndex && i < heartOutline.length; i++) {
                const p = heartOutline[i];
                drawTextAt(p.x, p.y, 0.9);
            }
        }

        // ─── حلقه انیمیشن ──────────────────────────────────────────────────
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = Math.min(timestamp - lastTimestamp, 50);
            lastTimestamp = timestamp;

            const totalOutline = heartOutline.length;

            if (phase === 'outline') {
                outlineTimer += delta;
                while (outlineTimer >= OUTLINE_INTERVAL) {
                    outlineTimer -= OUTLINE_INTERVAL;
                    for (let i = 0; i < BATCH_SIZE && outlineIndex < totalOutline; i++) {
                        outlineIndex++;
                    }
                }
                if (outlineIndex >= totalOutline) {
                    phase = 'done';
                }
            }

            render();

            if (phase !== 'done') {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                animationFrameId = null;
            }
        }

        // ─── شروع ──────────────────────────────────────────────────────────
        ctx.clearRect(0, 0, W, H);
        setTimeout(() => {
            animationFrameId = requestAnimationFrame(animate);
        }, 300);

        // ─── کلیک برای ری‌استارت ──────────────────────────────────────────
        function restart() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            outlineIndex = 0;
            phase = 'outline';
            outlineTimer = 0;
            lastTimestamp = 0;

            generateHeartOutline();

            ctx.clearRect(0, 0, W, H);
            render();

            animationFrameId = requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', restart);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restart();
        });
    })();
</script>
</body>
</html>

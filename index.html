<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030304">
<title>Ring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030304}
body{display:grid;place-items:center}
.app{position:relative;width:100vw;height:100vh;height:100dvh;background:#030304;overflow:hidden;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="app" id="app">
<canvas id="c"></canvas>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
const ly = document.createElement('canvas'), lc = ly.getContext('2d');
const b1 = document.createElement('canvas'), c1 = b1.getContext('2d');
const b2 = document.createElement('canvas'), c2 = b2.getContext('2d');

const TAU = Math.PI * 2, DUR = 20;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => {
    x = cl((x - a) / (b - a));
    return x * x * (3 - 2 * x);
};
const eo = x => 1 - Math.pow(1 - cl(x), 3);

let sd = 7;
const rnd = () => (sd = sd * 16807 % 2147483647) / 2147483647;

const nrm = v => {
    const l = Math.hypot(...v) || 1;
    return v.map(x => x / l);
};

const cross = (a, b) => [
    a[1]*b[2]-a[2]*b[1],
    a[2]*b[0]-a[0]*b[2],
    a[0]*b[1]-a[1]*b[0]
];

const sub = (a, b) => a.map((x, i) => x - b[i]);
const sp = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);

/* GEOMETRY */

const PTS = [];

const add = (p, n, k, ts, tf, o, extra) =>
    PTS.push({
        p,
        n: nrm(n),
        k,
        ts,
        tf,
        o,
        ph: rnd(),
        h: (rnd() * 997) | 0,
        ...extra
    });

const scat = (p, r) => [
    p[0] + (rnd()-.5)*r,
    p[1] + (rnd()-.5)*r,
    p[2] + (rnd()-.5)*r
];

/* RING BAND */

for (let i = 0; i < 760; i++) {

    const phi = TAU * (((i + .5) * .618034) % 1);
    const psi = TAU * (((i + .5) * .754878) % 1);

    const d = Math.min(phi, TAU - phi) / Math.PI;
    const w = .30 * (1 - .55 * sm(0, 1, d));

    const c = Math.cos(psi);
    const s = Math.sin(psi);

    const r = 1 + .11 * sp(c, .5);

    const nr = sp(c, 1.5) / .11;
    const nz = sp(s, 1.5) / w;

    const tf = 1 + d * 2.6 + rnd() * .3;

    add(
        [
            r * Math.sin(phi),
            -r * Math.cos(phi),
            w * sp(s, .5)
        ],
        [
            nr * Math.sin(phi),
            -nr * Math.cos(phi),
            nz
        ],
        0,
        tf - .4,
        tf,
        null
    );

    const q = PTS[PTS.length - 1];
    q.o = scat(q.p, 1.1);
}

/* DIAMOND PRONGS */

for (let i = 0; i < 4; i++) {

    const a = TAU * (i + .5) / 4;

    const base = [
        .08 * Math.cos(a),
        1.02,
        .08 * Math.sin(a)
    ];

    const tip = [
        .495 * Math.cos(a),
        1.52,
        .495 * Math.sin(a)
    ];

    const d = nrm(sub(tip, base));
    const s = nrm(cross(d, [0, 0, 1]));
    const w = cross(s, d);

    for (let j = 0; j < 42; j++) {

        const u = (j % 14) / 13;
        const ph = TAU * Math.floor(j / 14) / 3 + j;

        const n = s.map((x, m) =>
            Math.cos(ph) * x + Math.sin(ph) * w[m]
        );

        const p = base.map((x, m) =>
            x + u * (tip[m] - x) + n[m] * .022
        );

        const tf = 3.4 + u * 1.2 + rnd() * .2;

        add(p, n, 1, tf - .4, tf, scat(p, 1.1));
    }
}

/* DIAMOND */

{
    const G = .48;
    const GY = 1.42;
    const T = .30;
    const TY = 1.55;

    const cu = [0, 1.10, 0];
    const tc = [0, TY, 0];

    const m = 16;

    const tri = (a, b, c) => {

        let n = cross(sub(b, a), sub(c, a));

        const mid = a.map((x, i) =>
            (x + b[i] + c[i]) / 3 - [0, 1.3, 0][i]
        );

        if (
            n[0]*mid[0] +
            n[1]*mid[1] +
            n[2]*mid[2] < 0
        ) {
            n = n.map(x => -x);
        }

        const fp = rnd();

        for (let j = 0; j < 7; j++) {

            let u = rnd(), v = rnd();

            if (u + v > 1) {
                u = 1 - u;
                v = 1 - v;
            }

            const p = a.map((x, i) =>
                x + (b[i] - x) * u + (c[i] - x) * v
            );

            const tf =
                3 +
                (p[1] - 1.1) / .45 * 1.5 +
                rnd() * .3;

            add(
                p,
                n,
                2,
                .15 + rnd() * .9,
                tf,
                [
                    (rnd()-.5)*.9,
                    -.55 + (rnd()-.5)*.5,
                    (rnd()-.5)*.6
                ],
                { fp }
            );
        }
    };

    for (let i = 0; i < m; i++) {

        const a0 = TAU * i / m;
        const a1 = TAU * (i + 1) / m;

        const g0 = [
            G*Math.cos(a0),
            GY,
            G*Math.sin(a0)
        ];

        const g1 = [
            G*Math.cos(a1),
            GY,
            G*Math.sin(a1)
        ];

        const t0 = [
            T*Math.cos(a0),
            TY,
            T*Math.sin(a0)
        ];

        const t1 = [
            T*Math.cos(a1),
            TY,
            T*Math.sin(a1)
        ];

        tri(g0, g1, t0);
        tri(g1, t1, t0);
        tri(g0, g1, cu);
        tri(tc, t0, t1);
    }
}

/* LIGHTING */

const GR = [
    " .'`,",
    "-:;~^",
    "+=*xz",
    "coe08",
    "S&%$B",
    "#@MW8"
];

const DUST = ".:·+*,'";

const dust = Array.from({length:230}, () => ({
    x: rnd(),
    y: rnd(),
    a: .1 + rnd() * .3,
    s: rnd() * 6,
    c: DUST[(rnd() * DUST.length) | 0],
    t: 2 + rnd() * 4,
    v: .003 + rnd() * .01
}));

const orb = [
    {T:1.08, o:0, s:.5},
    {T:-1.08, o:2, s:-.4}
];

/* RENDER */

let W = 0;
let H = 0;
let u = 1;
let ang = 0;
let lt = 0;
let t0 = performance.now();
let last = 0;
let fr = 0;

function size() {

    const dpr = Math.min(2, devicePixelRatio || 1);

    const w = cv.clientWidth;
    const h = cv.clientHeight;

    if (w === W && h === H) return;

    W = w;
    H = h;

    u = W / 720;

    for (const [c, k] of [
        [cv, 1],
        [ly, 1],
        [b1, .25],
        [b2, .1]
    ]) {

        c.width = Math.max(2, W * dpr * k | 0);
        c.height = Math.max(2, H * dpr * k | 0);
    }

    cv._d = dpr;
}

/* SPARKLES */

function star(c, x, y, r, a) {

    c.save();

    c.globalCompositeOperation = 'lighter';

    for (const [dx, dy] of [[1, 0], [0, 1]]) {

        const g = c.createLinearGradient(
            x - dx*r,
            y - dy*r,
            x + dx*r,
            y + dy*r
        );

        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(.5, `rgba(255,255,255,${a})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');

        c.strokeStyle = g;
        c.lineWidth = Math.max(1, u * 1.1);

        c.beginPath();
        c.moveTo(x - dx*r, y - dy*r);
        c.lineTo(x + dx*r, y + dy*r);
        c.stroke();
    }

    c.fillStyle = `rgba(255,255,255,${a * .9})`;

    c.beginPath();
    c.arc(x, y, u * 1.4, 0, TAU);
    c.fill();

    c.restore();
}

/* MAIN FRAME */

function frame(t) {

    size();

    const d = cv._d;
    const S = 118 * u;

    const X0 = W / 2;
    const Y0 = H * .50;

    const cw = 5.6 * u;
    const ch = 8.6 * u;

    const L1 = nrm([-.4, .7, .6]);

    const L2 = nrm([
        Math.cos(t * .9),
        .25,
        Math.sin(t * .9)
    ]);

    const Hh = nrm([
        L1[0],
        L1[1],
        L1[2] + 1
    ]);

    const co = Math.cos(ang);
    const si = Math.sin(ang);

    const cells = new Map();
    const stars = [];

    let glints = 0;

    const proj = (x, y, z) => {

        const k = 1 / (1 - z * .1);

        return [
            X0 + x * S * k,
            Y0 - y * S * k,
            k
        ];
    };

    for (const q of PTS) {

        if (t < q.ts) continue;

        const s = eo((t - q.tf) / 1.2);

        const wob =
            (1 - s) *
            .035 *
            Math.sin(t * 5 + q.ph * 40);

        let x = q.o[0] + (q.p[0] - q.o[0]) * s + wob;

        let y = q.o[1] + (q.p[1] - q.o[1]) * s + wob;

        let z = q.o[2] + (q.p[2] - q.o[2]) * s;

        const X = x * co + z * si;
        const Z = -x * si + z * co;

        const nx = q.n[0] * co + q.n[2] * si;
        const ny = q.n[1];
        const nz = -q.n[0] * si + q.n[2] * co;

        let b =
            .16 +
            .55 * Math.max(0, nx*L1[0] + ny*L1[1] + nz*L1[2]) +
            .7 * Math.pow(
                Math.max(0, nx*L2[0] + ny*L2[1] + nz*L2[2]),
                2
            );

        const spec = Math.pow(
            Math.max(0, nx*Hh[0] + ny*Hh[1] + nz*Hh[2]),
            30
        );

        b += spec * .9;

        let spark = 0;

        if (q.k === 2) {

            b += .22;

            spark = Math.pow(
                Math.max(0, Math.sin(t * 2.3 + q.fp * 40)),
                12
            );

            b += spark * .9;
        }

        if (nz < -.15) b *= .45;

        b *=
            (.75 + .25 * (Z + 1.2) / 2.4) *
            sm(q.ts, q.ts + .3, t);

        const [px, py] = proj(X, y, Z);

        const col = Math.round(px / cw);
        const row = Math.round(py / ch);

        const key = col * 4096 + row;
        const e = cells.get(key);

        if (!e || Z > e.z) {

            cells.set(key, {
                z:Z,
                b:cl(b),
                h:q.h,
                col,
                row,
                tint:q.k === 2 ? q.fp : -1,
                sp:spark
            });
        }

        if (
            (spark > .75 || spec > .8) &&
            stars.length < 8 &&
            s > .9 &&
            nz > 0
        ) {
            stars.push([px, py, Math.max(spark, spec)]);
        }
    }

    /* DRAW RING */

    lc.setTransform(d, 0, 0, d, 0, 0);
    lc.clearRect(0, 0, W, H);

    lc.font = `${ch * .98}px ui-monospace,Menlo,Consolas,monospace`;

    lc.textBaseline = 'middle';
    lc.textAlign = 'center';

    const flick = fr >> 2;

    let hot = 0;

    for (const e of cells.values()) {

        if (e.b < .07) continue;

        const g = GR[Math.min(5, (e.b * 6) | 0)];

        const chr = g[
            (e.h + (e.h % 3 === 0 ? flick : 0)) % g.length
        ];

        let r = 55 + 200 * e.b;
        let gg = r;
        let bb = r;

        if (e.tint >= 0 && e.b > .55) {

            const k = Math.floor(e.tint * 3);

            if (k === 0) {
                bb += 25;
                r -= 15;
            } else if (k === 1) {
                r += 20;
                gg += 8;
                bb -= 25;
            } else {
                r += 15;
                gg -= 12;
            }
        }

        lc.fillStyle =
            `rgb(${cl(r,0,255)|0},${cl(gg,0,255)|0},${cl(bb,0,255)|0})`;

        lc.fillText(chr, e.col * cw, e.row * ch);

        if (e.b > .8) hot++;
    }

    /* DIAMOND LIGHT */

    const top = proj(0, 1.58, 0);

    const pl = sm(3.6, 5, t);
    const pulse = .75 + .25 * Math.sin(t * 3.1);

    if (pl > 0) {

        lc.save();

        lc.globalCompositeOperation = 'lighter';

        for (const a of [-40, -24, -11, 0, 11, 24, 40]) {

            const r = (a * Math.PI) / 180;

            const len =
                (30 + 48 * Math.cos(r) ** 2) *
                u * pl * pulse;

            const g = lc.createLinearGradient(
                top[0],
                top[1],
                top[0] + Math.sin(r) * len,
                top[1] - Math.cos(r) * len
            );

            g.addColorStop(0, 'rgba(255,255,255,.55)');
            g.addColorStop(1, 'rgba(255,255,255,0)');

            lc.strokeStyle = g;
            lc.lineWidth = u;

            lc.beginPath();
            lc.moveTo(top[0], top[1]);

            lc.lineTo(
                top[0] + Math.sin(r) * len,
                top[1] - Math.cos(r) * len
            );

            lc.stroke();
        }

        lc.restore();

        star(
            lc,
            top[0],
            top[1],
            20 * u * pl * pulse,
            .7 * pl
        );
    }

    for (const [x, y, a] of stars) {

        star(
            lc,
            x,
            y,
            (10 + 16 * cl(a)) * u,
            .55 + .4 * cl(a)
        );
    }

    /* ORBIT EFFECT */

    const oa = sm(5.4, 8, t);

    let ol = 0;

    if (oa > 0) {

        for (const o of orb) {

            const head = t * 1.2 * Math.sign(o.s) + o.o;
            const rot = ang * .55 + o.o;

            for (let i = 0; i < 150; i++) {

                const a = TAU * i / 150;
                const R = 1.75;

                let x = R * Math.cos(a);

                let y =
                    R *
                    Math.sin(a) *
                    Math.sin(o.T);

                let z =
                    R *
                    Math.sin(a) *
                    Math.cos(o.T);

                const X =
                    x * Math.cos(rot) +
                    z * Math.sin(rot);

                const Z =
                    -x * Math.sin(rot) +
                    z * Math.cos(rot);

                const [px, py] = proj(X, y, Z);

                const w = Math.pow(
                    Math.max(0, Math.cos(a - head)),
                    8
                );

                lc.fillStyle =
                    `rgba(205,215,235,${(.1 + .12 * (Z + 2) / 4 + .5 * w) * oa})`;

                lc.fillRect(
                    px,
                    py,
                    u * (1.1 + w * 1.6),
                    u * (1.1 + w * 1.6)
                );

                ol++;
            }
        }
    }

    /* COMPOSE */

    cx.setTransform(d, 0, 0, d, 0, 0);

    cx.globalCompositeOperation = 'source-over';

    cx.fillStyle = '#030304';
    cx.fillRect(0, 0, W, H);

    cx.drawImage(ly, 0, 0, W, H);

    /* BLOOM */

    for (const [bc, bx, al] of [
        [b1, c1, .55],
        [b2, c2, .5]
    ]) {

        bx.clearRect(0, 0, bc.width, bc.height);

        bx.drawImage(
            ly,
            0,
            0,
            bc.width,
            bc.height
        );

        cx.save();

        cx.globalCompositeOperation = 'lighter';
        cx.globalAlpha = al;
        cx.imageSmoothingEnabled = true;

        cx.drawImage(bc, 0, 0, W, H);

        cx.restore();
    }

    /* SMALL FLOATING PARTICLES */

    cx.font = `${7 * u}px ui-monospace,Menlo,monospace`;

    cx.textAlign = 'center';
    cx.textBaseline = 'middle';

    for (const p of dust) {

        const f = sm(p.t, p.t + 1.5, t);

        if (f <= 0) continue;

        const y = ((p.y - t * p.v) % 1 + 1) % 1;

        const a =
            p.a *
            f *
            (.55 + .45 * Math.sin(t * 1.7 + p.s));

        cx.fillStyle = `rgba(210,215,230,${a})`;

        cx.fillText(
            p.c,
            p.x * W,
            (.08 + y * .84) * H
        );
    }

    fr++;
}

/* ANIMATION LOOP */

function loop(now) {

    requestAnimationFrame(loop);

    let t = (now - t0) / 1000;

    if (t > DUR + .3) {

        t0 = now;
        t = 0;
        ang = 0;
        lt = 0;
    }

    if (now - last < 32) return;

    last = now;

    ang +=
        (Math.PI / 6) *
        sm(5.2, 6.6, t) *
        cl(t - lt, 0, .1);

    lt = t;

    frame(Math.min(t, 19.87));
}

/* CLICK TO RESTART */

document.getElementById('app').addEventListener(
    'pointerdown',
    () => {
        t0 = performance.now();
        ang = 0;
        lt = 0;
    }
);

requestAnimationFrame(loop);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#31060d">
<title>A Little Gift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');
:root{--wine:#390710;--wine2:#5b0d1b;--wine3:#811b2a;--gold:#d9b875;--pale:#f3e5c6;--ink:#45151b}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:'Cormorant Garamond',Georgia,serif}
body{background:#170307;color:var(--pale);overflow:hidden}
button{font:inherit}
.grain{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}
.lock-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;padding:24px;background:radial-gradient(ellipse at 50% 34%,#81202b 0,#4b0b17 38%,#21040a 100%);transition:opacity .8s,visibility .8s}
.lock-screen:before,.lock-screen:after{content:"";position:absolute;inset:22px;border:1px solid #c9a76555;pointer-events:none}
.lock-screen:after{inset:30px;border:1px solid #c9a76522}
.lock-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.gate{width:min(430px,92vw);text-align:center;position:relative;padding:30px 26px 24px}
.ornament{color:var(--gold);font-size:28px;letter-spacing:10px;opacity:.9}
.cameo{width:176px;height:176px;margin:8px auto 18px;display:grid;place-items:center;position:relative}
.cameo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 18px #160006aa)}
.kicker{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#dfc58f;margin:6px 0 10px}
.title{font-family:'Great Vibes',cursive;font-size:clamp(38px,7vw,55px);font-weight:400;color:#f4dfb4;margin:0;text-shadow:0 3px 15px #1b0008}
.subtitle{font-size:18px;font-style:italic;color:#d9bb91;margin:5px 0 20px}
.dots{display:flex;justify-content:center;gap:13px;margin:20px 0 17px}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid #e2c58c88;background:#ffffff12;transition:.2s}
.dot.filled{background:var(--gold);box-shadow:0 0 12px #e3bd6a88;transform:scale(1.2)}
.dot.error{background:#ff7777;border-color:#ff7777}
.pad{width:min(270px,82vw);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{height:48px;border:1px solid #d8b66d44;border-radius:5px;color:#f2dfbb;background:linear-gradient(145deg,#ffffff16,#21040a55);font-size:19px;cursor:pointer;transition:.15s;box-shadow:inset 0 1px #ffffff12}
.key:hover{background:#d7b36b24;border-color:#d8b66d99}.key:active{transform:scale(.94)}
.error{height:22px;color:#ffc0ad;font-style:italic;font-size:15px;margin-top:12px;opacity:0;transition:.2s}.error.show{opacity:1}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;padding:28px;background:radial-gradient(ellipse at 50% 42%,#661321 0,#350811 52%,#180308 100%);opacity:0;visibility:hidden;transition:opacity .8s}
.stage.open{opacity:1;visibility:visible}
.stage:before{content:"";position:absolute;inset:18px;border:1px solid #d5b26b44;pointer-events:none}
.stage-inner{width:min(780px,94vw);text-align:center;position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:5px;color:#d6b879;text-transform:uppercase}
.stage h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(42px,7vw,68px);margin:8px 0 0;color:#f3dfb6}
.stage-sub{font-style:italic;font-size:18px;color:#d7bb91;margin:0 0 28px}
.book-wrap{height:clamp(260px,43vw,350px);display:grid;place-items:center;perspective:1200px;position:relative}
.book{width:min(440px,84vw);height:270px;position:relative;transform-style:preserve-3d;filter:drop-shadow(0 28px 25px #100005aa);cursor:pointer}
.book-pages{position:absolute;inset:12px 8px 7px 25px;border-radius:5px 12px 12px 5px;background:repeating-linear-gradient(0deg,#e8d8b4 0 2px,#cdb98e 3px 4px);box-shadow:inset 0 0 18px #6e4b28aa;transform:translateZ(-5px)}
.book-cover{position:absolute;inset:0;border-radius:7px 15px 15px 7px;background:linear-gradient(110deg,#26040b 0%,#741626 13%,#4b0a16 45%,#7d1a2b 75%,#36050d 100%);border:2px solid #c49a52;box-shadow:inset 8px 0 12px #e4bd7040,inset -5px 0 14px #180108,0 0 0 5px #3b0710,0 0 0 6px #b78b4a;transform-origin:left center;transition:transform 1.25s cubic-bezier(.2,.8,.2,1);z-index:3;backface-visibility:visible}
.book-cover:before{content:"";position:absolute;inset:13px;border:1px solid #d8b56d99;border-radius:3px}
.book-cover:after{content:"";position:absolute;inset:21px;border:1px solid #d8b56d44;border-radius:2px}
.cover-emblem{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.cover-emblem img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 5px 7px #18000699)}
.cover-name{position:absolute;bottom:35px;left:0;right:0;font-size:12px;letter-spacing:5px;color:#e7c985}
.book-spine{position:absolute;left:-11px;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#21030a,#a34a3d,#3c0610);border:1px solid #c49a52;border-radius:5px 0 0 5px;z-index:4}
.inside{position:absolute;inset:7px 9px 7px 24px;background:linear-gradient(135deg,#fff3d6,#dfc99d);border-radius:3px 10px 10px 3px;display:grid;place-items:center;color:#64202a;padding:22px}
.inside:before{content:"";position:absolute;inset:12px;border:1px solid #a77a3c66}
.inside-mark{font-family:'Great Vibes',cursive;font-size:42px}
.book.opened .book-cover{transform:rotateY(-145deg)}
.book-hint{font-size:12px;letter-spacing:3px;color:#dfbd7a;margin-top:-3px;transition:opacity .3s}
.book.opened+.book-hint{opacity:0}
.letter{position:fixed;z-index:8;left:50%;top:50%;width:min(570px,90vw);min-height:280px;max-height:78vh;overflow:auto;margin:0;padding:35px 42px 30px;background:linear-gradient(135deg,#f7edcf,#e8d7ad);color:#4d1b22;border:1px solid #c49b58;box-shadow:0 20px 55px #10000599;opacity:0;transform:translate(-50%,-44%) scale(.97);transition:opacity .7s .35s,transform .7s .35s;pointer-events:none}
.letter:before{content:"";position:absolute;inset:11px;border:1px solid #a87c4055;pointer-events:none}
.letter.visible{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.letter h2{font-family:'Great Vibes',cursive;font-size:39px;font-weight:400;margin:0 0 18px;color:#7a1e2c}
#typing{white-space:pre-wrap;text-align:left;font-size:19px;line-height:1.75;position:relative;z-index:1}
.heart{color:#92283a;font-size:22px;margin-top:18px;opacity:0;transition:opacity .8s}.heart.show{opacity:1}
@media(max-width:600px){.lock-screen:before{inset:12px}.lock-screen:after{inset:18px}.gate{padding:15px}.cameo{width:150px;height:150px}.stage{padding:24px 12px}.book{height:230px}.book-wrap{height:255px}.cover-emblem img{width:145px;height:145px}.letter{padding:30px 25px;max-height:72vh}.letter h2{font-size:33px}#typing{font-size:17px}.stage-sub{margin-bottom:16px}}
@media(max-height:700px){.gate{padding:8px}.cameo{width:112px;height:112px;margin:3px auto 10px}.cameo img{width:100%;height:100%}.title{font-size:38px}.subtitle{margin:2px 0 10px}.dots{margin:12px 0}.key{height:40px}.book-wrap{height:230px}.book{height:205px}.letter{max-height:68vh;padding:22px 28px}}
</style>
</head>
<body>
<div class="grain"></div>
<section class="lock-screen" id="lockScreen">
  <div class="gate">
    <div class="ornament">✦ ❧ ✦</div>
    <div class="cameo" aria-hidden="true">
      <img src="seal.png" alt="Burgundy wax seal with gold H">
    </div>
    <div class="kicker">A PRIVATE EDITION</div>
    <h1 class="title">A little gift</h1>
    <p class="subtitle">Только для тебя</p>
    <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="pad" id="pad">
      <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
      <button class="key" data-key="clear">⌫</button><button class="key" data-key="0">0</button><button class="key" data-key="clear">↺</button>
    </div>
    <div class="error" id="error">Попробуй ещё раз…</div>
    <div class="ornament" style="margin-top:8px;font-size:17px">— ❦ —</div>
  </div>
</section>

<main class="stage" id="stage">
  <div class="stage-inner">
    <div class="eyebrow">THE BURGUNDY COLLECTION</div>
    <h1>A story kept for you</h1>
    <p class="stage-sub">One little book. One special message.</p>
    <div class="book-wrap">
      <div class="book" id="book" role="button" tabindex="0" aria-label="Открыть книгу">
        <div class="book-pages"></div>
        <div class="inside"><div class="inside-mark">For you, with care</div></div>
        <div class="book-spine"></div>
        <div class="book-cover">
          <div class="cover-emblem">
            <img src="seal.png" alt="Burgundy wax seal with gold H">
          </div>
          <div class="cover-name">MEMORIES · VOL. I</div>
        </div>
      </div>
    </div>
    <div class="book-hint" id="bookHint">TOUCH THE BOOK TO OPEN</div>
    <section class="letter" id="letter">
      <h2>Для тебя</h2>
      <div id="typing"></div>
      <div class="heart" id="heart">✦ &nbsp; ❦ &nbsp; ✦</div>
    </section>
  </div>
</main>
<script>
const PASSCODE="2009";
const MESSAGE=`Вчера вечером, когда ты сказала, что не можешь показать мне свою любовь и что для этого есть много способов, сначала мне стало немного грустно. Честно говоря, на мгновение возникло ощущение, будто я в чём-то недорабатываю и делаю недостаточно.

Но потом, Но потом всё стало яснее: ты права. Чаще всего я не показываю этого своими поступками. Хотя в моём сердце так много любви к тебе, мне словно не всегда удаётся правильно её выразить.

Поэтому я хочу стараться больше. Мне нужно научиться понимать, что любовь — это не только чувство, но и поступки, это выбор, который нужно подтверждать каждый день.

Хочу, чтобы ты знала: даже когда я молчу и ничего не говорю, в моём сердце всё равно бушует целый океан любви к тебе. Надеюсь, что волнение в моём голосе и грусть, которую ты увидела в моих глазах, не скрыли от тебя этого.

Я люблю тебя всем сердцем и всей душой. И говорю это не под влиянием минутных эмоций, а искренне, от всего сердца.

Ты для меня нечто большее, чем просто мимолётная часть жизни. Ты занимаешь особое место в моём мире. И каждый день я буду стараться доказывать тебе это.

Я люблю тебя. Сильнее, чем когда-либо. ♥`;
let entered="",locked=false,opened=false,pos=0,timer=null;
const dots=[...document.querySelectorAll(".dot")];
const error=document.getElementById("error");
function paint(){dots.forEach((d,i)=>d.classList.toggle("filled",i<entered.length))}
function press(k){
 if(locked)return;
 if(k==="clear"){entered=entered.slice(0,-1);error.classList.remove("show");paint();return}
 if(!/^\d$/.test(k)||entered.length>=4)return;
 entered+=k;paint();
 if(entered.length===4){locked=true;setTimeout(check,120)}
}
function check(){
 if(entered===PASSCODE){
  document.getElementById("lockScreen").classList.add("hidden");
  setTimeout(()=>document.getElementById("stage").classList.add("open"),260);
 }else{
  dots.forEach(d=>d.classList.add("error"));error.classList.add("show");
  setTimeout(()=>{entered="";dots.forEach(d=>d.classList.remove("error"));error.classList.remove("show");paint();locked=false},850);
 }
}
document.getElementById("pad").addEventListener("click",e=>{const b=e.target.closest("button");if(b)press(b.dataset.key)});
document.addEventListener("keydown",e=>{
 if(!document.getElementById("lockScreen").classList.contains("hidden")){
  if(/^\d$/.test(e.key))press(e.key);
  if(e.key==="Backspace")press("clear");
 }
});
function openBook(){
 if(opened)return;opened=true;
 const book=document.getElementById("book");
 book.classList.add("opened");
 document.getElementById("bookHint").textContent="A MESSAGE JUST FOR YOU";
 setTimeout(()=>{
  document.getElementById("letter").classList.add("visible");
  typeNext();
 },850);
}
document.getElementById("book").addEventListener("click",openBook);
document.getElementById("book").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openBook()}});
function typeNext(){
 const out=document.getElementById("typing");
 if(pos>=MESSAGE.length){document.getElementById("heart").classList.add("show");return}
 out.textContent+=MESSAGE[pos++];
 const ch=MESSAGE[pos-1];
 timer=setTimeout(typeNext,ch==="\n"?220:([",",".","♥"].includes(ch)?150:34));
}
</script>
</body>
</html>
